[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcsfx"
version = "0.1.0"
description = "Agent-oriented game footage to sound-effect video CLI"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "tos>=2.8,<3"]

[project.scripts]
mcsfx = "mcsfx.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcsfx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["media: requires FFmpeg and ffprobe", "live: explicit opt-in paid provider test"]

[tool.ruff]
target-version = "py312"
line-length = 100
